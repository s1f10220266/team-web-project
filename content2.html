        <div class="main">

            <div class="information">

                <h1>スペイン紹介ページ</h1>

                <img src="images/spain.png">

                <p>スペインはヨーロッパの南西部に位置する「情熱の国」で、観光地として人気です。スペイン料理の「パエリア」や「サグラダファミリア」、「牛追い祭り」や「トマト祭り」が有名です。</p>

                <h2>目次</h2>
                    <p><a href="#flag">国旗の意味</a></p>
                    <p><a href="#time_diff">時差</a></p>
            </div>

            <div id="flex">
                <div id="map">
                    <div class="information">
                        <p>
                            
                        </p>
                        <iframe
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6247519.016149701!2d-8.203027405316911!3d40.130111195181534!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xc42e3783261bc8b%3A0xa6ec2c940768a3ec!2z44K544Oa44Kk44Oz!5e0!3m2!1sja!2sjp!4v1657386730691!5m2!1sja!2sjp"

            <h2><a id="flag">国旗の意味</a></h2>
            <div class="information">
                <img src="/images/spain.png" id="picture1">
                <p>「血と金の旗」で、黄色は豊かな国土を、赤色は血を表しています。
                </p>
            </div>

            <hr>

            <h2><a id="time_diff">時差</a></h2>
            <div class="information">
                <p>日本とスペインの時差は<strong>7時間</strong>です</p>
                <p>ログイン時</p>
                <p>
                    日本：<span id="japannow"></span>
                    スペイン：<span id="spainnow"></span>
                </p>
            </div>

        </div>

        <script>
            'use strict';

            let now = new Date();
            let ja_hour = now.getHours();
            let time = now.getMinutes();
            let month = now.getMonth();
            let date = now.getDate();

            let spain_date = date;
            let spain_hour = ja_hour - 7;
            if(spain_hour < 0) {
                spain_date -= 1;
                spain_hour = 25 - 7;
            }

            const ja_present = `${month + 1}/${date}/${ja_hour}:${time}`;
            const spain_present = `${month + 1}/${spain_date}/${spain_hour}:${time}`;

            document.getElementById('japannow').textContent = ja_present;
            document.getElementById('spainnow').textContent = spain_present;

            const images = ["Sagradafamilia.jpeg", "images/LapLand.jpg", "images/moomin.jpg"];
            let current = 0;
            document.getElementById('imageIndex').textContent = current + 1;

            function changeImage(num) {
                if (current + num >= 0 && current + num < images.length) {
                    current += num;
                    document.getElementById('slide').src = images[current];
                    document.getElementById('imageIndex').textContent = current + 1;
                };
            };

        </script>
