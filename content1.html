<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>チームで作るwebサイト</title>
        <link rel="stylesheet" href="css/contents1.css">
    </head>
    <body>
        <h1>インド</h1>
        <img src="images/flag-of-india-india-flag.jpg">
        <h1>主な観光名所</h1>
        <h2 id="sightseiin_hedder">タージマハル</h2>
        <h2 id="sightseiin_hedder2">エローラ石窟群</h2>
        <div class="print_side">
        <p class="size_image"><img src="images/main1.jpg"></p>
        <p class="size_image"><img src="images/エローラ.jpg"></p>
        </div>
        <h1>人気の食べ物</h1>
        <h2 id="food_hedder">カレーとナン</h2>
        <h2 id="food_hedder2">グラブジャムン</h2>
        <div class="print_side">
        <p class="size_image"><img src="images/image.jpg"></p>
        <p class="size_image"><img src="images/Gulaab_Jamun_(homemade!)_bright.jpg"></p>
        </div>
        <h1>インドに行ったらやってみたいこと</h1>
        <h2 id="place_hedder">ゾウに乗る</h2>
        <div id="place_I_wanna_go">
        <p class="size_image"><img src="images/10692001514.jpg"></p></div>

        <hr>



        <p>時差は</p>
        <p>
            日本：<span id="japannow"></span>
            フィンランド：<span id="indianow"></span>
        </p>

        <div id="slide_button">
            <img src="images/flag-of-india-india-flag.jpg" id="slide">
            <p><span id="imageIndex"></span>枚目</p>
            <form action="#">
                <p>
                    <input type="button" id="prev" value="prev" onclick="changeImage(-1)">
                    <input type="button" id="next" value="next" onclick="changeImage(1)">
                </p>
            </form>
        
        </div>
        <script>
            'use strict';
            const now = new Date();
            const ja_hour = now.getHours();
            const time = now.getMinutes();
            const month = now.getMonth();
            const date = now.getDate();


            const indiatime = time - 30
            const indiahour = ja_hour - 3

            if (indiatime < 0) {
                indiahour -= 1;
                indiatime += 60
            }

            const ja_present = `${month + 1}/${date}/${ja_hour}:${time}`;
            const india_present = `${month + 1}/${date}/${indiatime}:${indiatime}`
            document.getElementById('japannow').textContent = ja_present;
            document.getElementById('indianow').textContent = india_present;

            const images = ["images/main1.jpg", "images/エローラ.jpg"];
            let current = 0;
            document.getElementById('imageIndex').textContent = current + 1;
            function changeImage(num) {
                if (current + num >= 0 && current + num < images.length) {
                    current += num;
                    document.getElementById('slide').src = images[current];
                    document.getElementById('imageIndex').textContent = current + 1;
                };
            };



        </script>

    </body>
</html>
