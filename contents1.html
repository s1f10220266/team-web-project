<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>ひとつめ</title>
        <link rel="stylesheet" href="css/contents1.css">
    </head>

    <body>
        <h1>フィンランド</h1>
        <img src="../../images_for_team/frag.png">
        
        <div>
            <img src="../../images_for_team/frag.png" id="slide">
            <div id="group1">
                <form>
                    <p>
                        <input type="submit" value="Previous" id="Previous">
                        <input type="submit" value="Next" id="Next">
                    </p>   
                </form>
            </div>
                
        </div>
        
        
        
        <ol>
            <h3>目次</h3>
            
            <li><a href="#flag">国旗の意味</a></li>
            <li><a href="#time_diff">時差</a></li>
            <li><a href="#spot">観光スポット</a></li>
        </ol>

        

        
        <h2><a id="flag">国旗の意味</a></h2>
        <img src="../../images_for_team/frag.png" id="picture1">
        <p>北ヨーロッパ諸国で多く用いられている、いわゆる“スカンジナビアクロス”のデザインを採用した国旗で、青は湖沼と澄んだ空を、白は清らかな雪を象徴する。</p>
        
        <h3><a id="time_diff">時差</a></h3>
        <p>日本とフィンランドの時差は6時間です</p>
        
        <p>
            日本：<span id="japannow"></span>
            フィンランド：<span id="finnow"></span>
        </p>
        
        <h2><a id="spot">観光スポット</a></h2>
        <ul>
            <li>サンタクロース村</li>
            <li>ラップランド</li>
            <li>ムーミンワールドへムーミン</li>
        </ul>





        <script>
            'use strict';

            const now = new Date();
            const ja_hour = now.getHours();
            const time = now.getMinutes();
            const month = now.getMonth();
            const date = now.getDate();

            const ja_present = `${month + 1}/${date}/${ja_hour}:${time}`;
            const fin_present = `${month + 1}/${date}/${ja_hour - 6}:${time}`
           
            document.getElementById('japannow').textContent = ja_present;
            document.getElementById('finnow').textContent = fin_present;

            
            const images = ['../../images_for_team/frag.png','../../images_for_team/Santa.png']
            let current = 0

            function chage_images(num) {
                if(current + num >= 0 && current + num <= length.images) {
                    current += num;
                    document.getElementById('slide').src = images[current];
                };
            }
            document.getElementById('previous').onsubmit = function() {
                chage_images(-1);
            };

            document.getElementById('next').onsubmit = function() {
                chage_images(1);
            };
            

        </script>


    </body>
</html>
